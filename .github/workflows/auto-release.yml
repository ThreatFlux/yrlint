name: Auto Release

# Release runs for main are serialized, never cancelled: updating a release
# proposal or publishing a tag and GitHub Release must finish. A queued run that
# starts after a release skips itself, because main has advanced or the tag
# exists. The head repository is part of the key, so runs triggered from
# another repository never share it. Dry runs use their own group.
concurrency:
  group: auto-release-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

on:
  # workflow_run is needed to release only after CI and Security pass on main.
  # The release job below ignores every completed run except a successful push
  # run from this repository, and nothing from the triggering run is executed.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, release or downstream dispatch
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-release-source:
    name: Verify release proposal source
    # Release only from successful push runs on this repository's main; pull
    # request runs, fork runs and scheduled runs never start a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.source.outputs.proceed }}
    steps:
      - name: Check out the same candidate as the reusable workflow
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify the exact merged proposal before tagging an untagged version
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          repo="repos/$GITHUB_REPOSITORY"
          candidate="$(git rev-parse HEAD)"
          if [[ "$(gh api "$repo/commits/main" --jq .sha)" != "$candidate" ]]; then
            echo "main advanced; skipping $candidate"
            exit 0
          fi

          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Auto Release could not identify the Cargo version.'
            exit 1
          fi
          tag="v$version"
          refs="$(gh api --paginate --slurp "$repo/git/matching-refs/tags/$tag")"
          if jq -e --arg ref "refs/tags/$tag" 'any(.[][]; .ref == $ref)' <<< "$refs" >/dev/null; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The runtime tags a manifest ahead of the latest tag. Require that
          # the candidate is the merge of the proposal and has its exact tree.
          pulls="$(gh api --paginate --slurp "$repo/commits/$candidate/pulls")"
          proposal_sha="$(jq -er --arg sha "$candidate" --arg repo "$GITHUB_REPOSITORY" --arg tag "$tag" '
            [.[][] | select(.merged_at != null and .merge_commit_sha == $sha and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .head.ref == "automation/release" and .head.repo.full_name == $repo and
              .title == ("chore(release): " + $tag)) | .head.sha]
            | if length == 1 then .[0] else empty end
          ' <<< "$pulls")" || proposal_sha=''
          if [[ ! "$proposal_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(gh api "$repo/git/commits/$proposal_sha" --jq .tree.sha)" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "::error::Refusing to tag $tag at $candidate without an exact merged release proposal. See CONTRIBUTING.md."
            exit 1
          fi
          echo 'proceed=true' >> "$GITHUB_OUTPUT"

  release:
    needs: verify-release-source
    if: needs.verify-release-source.outputs.proceed == 'true'
    # The reusable workflow's jobs can only narrow these grants.
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@240529daaf569ee1f5b5e22f683b113ec4e1d62d # v0.7.13
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      create-pr: true
      required-workflows: CI,Security
      # After the release proposal merges, the threatflux-automation App pushes
      # the tag, which starts release.yml by itself. The reusable workflow
      # skips this dispatch. It only runs when the App credentials are absent
      # and the release falls back to GITHUB_TOKEN, whose tag starts nothing.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
