version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    # Version updates wait a week after an upstream release, so a compromised or
    # quickly yanked release is not proposed at once. Security updates are not
    # delayed by this setting.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    cooldown:
      default-days: 7

  # For any base image update Dependabot misses, use the digest refresh
  # command documented in Dockerfile.
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    cooldown:
      default-days: 7
