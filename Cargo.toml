[package]
name = "yrlint"
version = "0.1.5"
edition = "2021"
authors = ["ThreatFlux"]
description = "A linter for YARA rules that checks for best practices and performance issues"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ThreatFlux/yrlint"
homepage = "https://github.com/ThreatFlux/yrlint"
keywords = ["yara", "yara-x", "linter", "malware", "security"]
categories = ["command-line-utilities", "development-tools"]
# Ship only what builds and documents the crate; CI, Docker and example rules
# stay in the repository.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
# YARA rule parsing using regex

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# CLI arguments parsing
clap = { version = "4.3", features = ["derive"] }

# Error handling and utilities
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# File handling utilities
globset = "0.4"
walkdir = "2.3"

# Regular expressions
regex = "1.9"

[dev-dependencies]
tempfile = "3.8"
